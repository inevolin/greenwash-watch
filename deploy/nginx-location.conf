# Added inside the `server { server_name nevolin.be ... listen 443 ssl; }` block of
# /etc/nginx/sites-available/nevolin.be (before `location /`).
    location = /greenwashing-watchdog { return 301 /greenwashing-watchdog/; }
    location /greenwashing-watchdog/ {
        proxy_pass http://127.0.0.1:3300/;   # trailing slash strips the prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 16k;
    }
